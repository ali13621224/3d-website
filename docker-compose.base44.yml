services:
  web:
    # Plain runtime base image + bind-mounted source: the dev server always runs
    # the cloned code, so edits show up without rebuilding an image.
    image: node:22
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # Dependencies live in a named volume, installed at startup from the
      # checkout's lockfile, so they never land in the repo.
      - node_modules:/app/node_modules
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund && exec npm run dev
    restart: on-failure
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 120s

volumes:
  node_modules:
